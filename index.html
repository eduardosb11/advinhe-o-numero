<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advinhe o número!</title>
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>Jogo de advinhação</h1>
        <p>Regras:</p>
        <ul>
            <li>Você tem 3 chances para descobrir o número.</li>
            <li>Após cada palpite você recebe uma dica.</li>
            <li>O número secreto é escolhido aleatoriamente entre 1 e 100.</li>
        </ul>
    </header>

    <body>
        <p><span id="tentativas"></span> Tentativas restantes</p>
        <form>
            <input type="number" name="palpite" id="palpite" placeholder="Digite o seu palpite!">
            <input type="submit" value="chutar">
        </form>
        <p id="mensagem">Digite o seu palpite e clique em chutar!</p>
    </body>

    <footer></footer>
</body>

</html>
